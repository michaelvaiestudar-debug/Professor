<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professor MD 3.0</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f6fb;color:#16213a}header{background:#182b50;color:#fff;padding:24px 18px}header h1{margin:0 0 8px;font-size:34px}main{max-width:920px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #15264a12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:11px;padding:13px 16px;background:#182b50;color:#fff;font-size:16px}button.alt{background:#e9edf5;color:#182b50}input,textarea{width:100%;padding:12px;border:1px solid #ccd4e2;border-radius:10px;margin:7px 0 12px;font-size:16px}.block{border:1px solid #e0e5ef;border-radius:14px;padding:14px;margin:10px 0}.answer{white-space:pre-wrap;line-height:1.55;background:#f7f9fc;padding:14px;border-radius:12px;margin-top:12px}.muted{color:#647089}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><h1>Professor MD</h1><p>Seu professor particular para preparação FUMARC — TRT-MG</p></header><main>
<div class="card"><h2>📚 O que estudar hoje</h2><p class="muted">2 horas: 40 min teoria + 20 min Engenharia Reversa em cada bloco.</p><div id="today">Carregando...</div></div>
<div class="card"><h2>🤖 Pergunte ao Professor</h2><textarea id="q" rows="4" placeholder="Ex.: Explique depreciação e depois faça uma questão estilo FUMARC."></textarea><div class="grid"><button onclick="ask()">Perguntar</button><button class="alt" onclick="voice()">🎤 Falar</button></div><div id="ans"></div></div>
<div class="card"><h2>📄 Enviar PDF</h2><input id="pdf" type="file" accept=".pdf"><button onclick="upload()">Enviar PDF</button><p id="up" class="muted"></p></div>
<div class="card"><h2>📝 Registrar estudo</h2><div class="grid"><input id="disc" value="Contabilidade Geral"><input id="topic" value="Ativo Imobilizado"></div><div class="grid"><input id="mins" type="number" value="60"><input id="score" type="number" min="0" max="100" value="0"></div><textarea id="notes" rows="2" placeholder="Erros ou pontos para revisar"></textarea><button onclick="save()">Salvar sessão</button></div>
<div class="card"><h2>📊 Meu progresso</h2><div id="dash">Carregando...</div></div><div class="card"><b id="status">Verificando sistema...</b></div></main>
<script>
async function api(u,o){let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}
async function load(){try{let[t,s,d]=await Promise.all([api('/api/today'),api('/api/status'),api('/api/dashboard')]);status.innerHTML=s.openai_configured?'🟢 Sistema + OpenAI online':'🟡 Sistema online — configure a OpenAI';today.innerHTML=t.blocks.map(b=>`<div class="block"><b>${b.discipline}</b><br>${b.topic}<br>⏱️ ${b.theory} teoria + ${b.reverse} reversa<p>${b.action}</p></div>`).join('');dash.innerHTML=`Média: <b>${d.average_score}%</b> &nbsp; Tempo registrado: <b>${d.study_minutes} min</b><br><br>`+(d.materials.length?d.materials.map(x=>'📄 '+x.filename).join('<br>'):'Nenhum PDF enviado.')}catch(e){status.textContent='🔴 '+e.message}}
async function ask(){let qv=q.value.trim();if(!qv)return;ans.innerHTML='Pensando...';try{let d=await api('/api/ask',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({text:qv})});ans.innerHTML='<div class="answer">'+esc(d.answer)+'</div>';speak(d.answer)}catch(e){ans.innerHTML='<div class="answer">Erro: '+esc(e.message)+'</div>'}}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function voice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Reconhecimento de voz não disponível.');let r=new R();r.lang='pt-BR';r.onresult=e=>{q.value=e.results[0][0].transcript;ask()};r.start()}
async function upload(){let f=pdf.files[0];if(!f)return alert('Escolha um PDF.');let fd=new FormData();fd.append('file',f);up.textContent='Enviando...';try{let d=await api('/api/upload',{method:'POST',body:fd});up.textContent=d.message;load()}catch(e){up.textContent='Erro: '+e.message}}
async function save(){let fd=new URLSearchParams({discipline:disc.value,topic:topic.value,minutes:mins.value,score:score.value,notes:notes.value});try{await api('/api/session',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd});alert('Sessão registrada!');load()}catch(e){alert(e.message)}}load();
</script></body></html>
